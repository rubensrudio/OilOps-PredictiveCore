<!DOCTYPE html>
<!--
  Static render of ops-ui InspectionComponent (Angular 17) — "OK / no alert" state.
  Markup and CSS are copied verbatim from:
    ops-ui/src/app/pages/inspection/inspection.component.html
    ops-ui/src/app/pages/inspection/inspection.component.css
    ops-ui/src/styles.css
  Mock data is injected in place of the live HttpClient response so the page
  can be screenshotted without a running ops-api backend.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OilOps — Prediction Inspection (OK)</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background-color: #f5f5f5;
  color: #333;
}
.inspection-container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; font-family: sans-serif; }
h1 { font-size: 1.6rem; margin-bottom: 1.5rem; color: #1a1a2e; }
.inspection-form { display: flex; gap: 1rem; align-items: flex-end; margin-bottom: 1.5rem; flex-wrap: wrap; }
.form-group { display: flex; flex-direction: column; gap: 0.25rem; }
label { font-size: 0.875rem; font-weight: 600; color: #333; }
input[type="text"] { padding: 0.5rem 0.75rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; min-width: 220px; outline: none; }
button { padding: 0.5rem 1.25rem; font-size: 1rem; background-color: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; min-width: 90px; }
.result-card { border: 1px solid #ddd; border-radius: 6px; padding: 1.25rem; background-color: #fafafa; }
.result-card h2 { margin-top: 0; font-size: 1.1rem; color: #1a1a2e; }
.result-table { width: 100%; border-collapse: collapse; }
.result-table caption { text-align: left; font-size: 0.875rem; color: #555; margin-bottom: 0.5rem; font-style: italic; }
.result-table th, .result-table td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #eee; text-align: left; }
.result-table th[scope="row"] { font-weight: 600; width: 180px; color: #444; }
.badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 12px; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.05em; }
.badge-alert { background-color: #e74c3c; color: #fff; }
.badge-ok { background-color: #27ae60; color: #fff; }
</style>
</head>
<body>
<section class="inspection-container" aria-label="Prediction Inspection">
  <h1>OilOps — Prediction Inspection</h1>
  <form class="inspection-form" aria-label="Asset inspection form">
    <div class="form-group">
      <label for="assetIdInput">Asset ID</label>
      <input id="assetIdInput" type="text" value="PUMP-001" placeholder="e.g. PUMP-001" autocomplete="off" />
    </div>
    <button type="submit">Inspect</button>
  </form>
  <div class="result-card" aria-label="Prediction result">
    <h2>Prediction Result</h2>
    <table class="result-table" aria-label="Prediction details">
      <caption>Asset: PUMP-001</caption>
      <tbody>
        <tr><th scope="row">Anomaly Score</th><td>0.2143</td></tr>
        <tr><th scope="row">Confidence Score</th><td>0.9876</td></tr>
        <tr><th scope="row">Alert</th><td><span class="badge badge-ok">OK</span></td></tr>
        <tr><th scope="row">Severity</th><td>—</td></tr>
        <tr><th scope="row">Explain Status</th><td>ready</td></tr>
        <tr><th scope="row">Predicted At</th><td>2026-06-03T14:22:10Z</td></tr>
        <tr><th scope="row">Model Version</th><td>vibration-autoencoder-v1</td></tr>
      </tbody>
    </table>
  </div>
</section>
</body>
</html>
